name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run every day at 1:00 AM UTC
    - cron: '0 1 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7.0.1

      - name: Install depencies
        run: yarn install

      # Keep the link check results between runs (rechecked after 1 day)
      - name: Restore link check cache
        uses: actions/cache@v6.1.0
        with:
          path: .cache
          key: eleventy-fetch-${{ github.run_id }}
          restore-keys: eleventy-fetch-

      - name: Build website
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: yarn build

      - name: Copy site to DigitalOcean
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync --checksum --delete --human-readable --ignore-errors --progress --recursive --stats --times --verbose \
            -e "ssh -i ~/.ssh/id_deploy" public/ "$SSH_USERNAME@$SSH_HOST:$SSH_PATH"
